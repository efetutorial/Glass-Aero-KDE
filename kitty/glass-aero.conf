# Frutiger Aero — blue glass with readable text.
font_family DejaVu Sans Mono
font_size 11.5

background #153c55
foreground #edf8ff
background_opacity 0.10
dynamic_background_opacity yes
background_image none
background_image_layout scaled
background_tint 0.0

cursor #0079bb
cursor_text_color #ffffff
cursor_shape block
selection_background #a7ddfa
selection_foreground #12384f
url_color #83d8ff

window_padding_width 12
window_border_width 1.5
active_border_color #249cda
inactive_border_color #a6cce0
hide_window_decorations no
remember_window_size yes
initial_window_width 100c
initial_window_height 28c

# Show tabs only when more than one tab is open.
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style round
tab_bar_margin_width 8.0
tab_bar_margin_height 4.0 4.0
tab_bar_background #153c55
tab_bar_margin_color #153c55
active_tab_foreground #ffffff
active_tab_background #227ca6
active_tab_font_style bold
inactive_tab_foreground #c6e8f8
inactive_tab_background #214c65
inactive_tab_font_style normal
tab_title_template "{title}"

# ANSI colors for the blue glass background.
color0 #172e41
color1 #ff8190
color2 #a0e391
color3 #f3d68a
color4 #80c6ff
color5 #d8b4f6
color6 #88e3dd
color7 #d9effa
color8 #89a9bd
color9 #ff9ba5
color10 #b6f29e
color11 #ffe6a0
color12 #a3dcff
color13 #e4c4ff
color14 #a4f3e8
color15 #ffffff

map ctrl+shift+r load_config_file

# Ask the Wayland compositor for frosted glass.
background_blur 20
